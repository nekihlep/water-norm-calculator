name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: API тесты (Behave + Python)
  api-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        pip install fastapi uvicorn behave requests httpx

    - name: Start server
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 5

    - name: Run API tests (Behave)
      run: behave features/ --format html -o reports/api-report.html

    - name: Upload API test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-report-python${{ matrix.python-version }}
        path: reports/

  # JOB 2: UI тесты (Playwright + JS)
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        browser: [chromium, webkit]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Python dependencies
      run: pip install fastapi uvicorn

    - name: Install JS dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install ${{ matrix.browser }} --with-deps

    - name: Start server
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 5

    - name: Run UI tests
      run: npx playwright test --project=${{ matrix.browser }}

    - name: Upload UI test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-report-${{ matrix.browser }}-node${{ matrix.node-version }}
        path: playwright-report/

  # JOB 3: Проверка статуса
  check-status:
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()

    steps:
    - name: Check overall status
      run: |
        if [[ "${{ needs.api-tests.result }}" == "success" && "${{ needs.ui-tests.result }}" == "success" ]]; then
          echo "All tests passed!"
        else
          echo "Some tests failed!"
          exit 1
        fi