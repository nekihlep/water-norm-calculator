name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ui-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
        browser: [chromium, webkit]
        exclude:
          - os: macos-latest
            browser: webkit

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Python dependencies
      run: pip install fastapi uvicorn

    - name: Install JS dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install ${{ matrix.browser }} --with-deps

    - name: Start server
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 10
      shell: bash

    - name: Run UI tests
      run: npx playwright test --project=${{ matrix.browser }}

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: report-${{ matrix.os }}-node${{ matrix.node-version }}-${{ matrix.browser }}
        path: playwright-report/

  allure-report:
    runs-on: ubuntu-latest
    needs: [ui-tests]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Allure
      run: npm install -g allure-commandline

    - name: Download reports
      uses: actions/download-artifact@v4
      with:
        path: all-reports

    - name: Generate Allure report
      run: |
        mkdir -p allure-results
        find all-reports -name "*.json" -exec cp {} allure-results/ \; 2>/dev/null || true
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [ui-tests, allure-report]
    if: always()

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Water Norm Calculator
            
            Tests: ${{ needs.ui-tests.result }}
            Report: ${{ needs.allure-report.result }}
            
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
