<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Water Intake Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1> Калькулятор нормы воды</h1>

        <div class="card">
            <div class="form-group">
                <label for="city">🌍 Выберите город:</label>
                <select id="city">
                    <option value="">--Выберите город--</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight">⚖️ Вес (kg):</label>
                <input type="number" id="weight" placeholder="Введите свой вес">
                <small class="hint">Min: 20 kg, Max: 300 kg</small>
            </div>

            <button id="calculateBtn">Высчитать норму</button>
            <div id="result" class="result hidden">
                <div class="result-text"></div>
            </div>

            <div id="error" class="error hidden">
                <div class="error-text"></div>
            </div>
        </div>

        <div class="info">
            <h3>ℹ️ Как это работает</h3>
            <p>Формула: <strong>30 ml × weight × temperature coefficient</strong></p>
            <p>🌡️ Когда температура > 30°C, норма увеличивается на  30%</p>
            <p>❄️ Когда температура< 30°C, норма падает на  10%</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
